<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CareWell Hospital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F4F7FB; --card:#FFFFFF; --ink:#0F2A4A; --muted:#64748B; --line:#E2E8F0; --blue:#2563EB; --blue-tint:#EFF4FE; --shadow:0 1px 2px rgba(15,42,74,.04),0 8px 24px rgba(15,42,74,.06); }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; }
  h1 { font-family:'Plus Jakarta Sans',sans-serif; }
  .wrap { max-width: 760px; padding: 40px 24px; text-align: center; }
  .logo { width:56px; height:56px; border-radius:14px; background:var(--blue-tint); display:flex; align-items:center; justify-content:center; margin: 0 auto 18px; }
  h1 { font-size: 28px; margin: 0 0 6px; }
  .tagline { color: var(--muted); font-size: 14px; margin-bottom: 40px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; text-align: left; }
  a.card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; text-decoration: none; color: var(--ink); box-shadow: var(--shadow); }
  a.card:hover { border-color: var(--blue); }
  .card-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .card-sub { font-size: 12.5px; color: var(--muted); }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 3v18M3 12h18" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/></svg></div>
  <h1>CareWell Hospital</h1>
  <div class="tagline">Real-time patient wait time prediction system</div>
  <div class="grid">
    <a class="card" href="/patient_checkin.html"><div class="card-title">Patient Check-In</div><div class="card-sub">Check in and see your live estimated wait time</div></a>
    <a class="card" href="/doctor_dashboard.html"><div class="card-title">Doctor Dashboard</div><div class="card-sub">Live queue management for staff</div></a>
    <a class="card" href="/analytics_dashboard.html"><div class="card-title">Hospital Analytics</div><div class="card-sub">Model performance and dataset insights</div></a>
    <a class="card" href="/docs"><div class="card-title">API Docs</div><div class="card-sub">Interactive Swagger documentation</div></a>
  </div>
</div>
</body>
</html>
